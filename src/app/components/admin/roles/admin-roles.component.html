<div class="header">
  <h1>Task Manager</h1>
  <span>Welcome, admin {{ adminName }}</span>
</div>

<div class="roles">
  <h2>Manage Roles</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users" (dblclick)="editRole(user)">
        <td>{{ user.name }}</td>
        <td class="role-cell">
          {{ getRoleName(user.roleId) }}
          <button class="menu-btn" (click)="toggleMenu(user, $event)">⋮</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Context menu -->
<ul *ngIf="activeUser" class="dropdown-menu" [style.top.px]="menuPosition.top" [style.left.px]="menuPosition.left">
  <li (click)="editRole(activeUser)">Edit</li>
  <li (click)="confirmDelete(activeUser)">Delete</li>
</ul>

<!-- Modal for editing role -->
<div *ngIf="showRoleModal" class="modal-overlay" (click)="cancel()"></div>
<div *ngIf="showRoleModal" class="modal">
  <div class="modal-content">
    <h3>Edit {{ selectedUser?.name }} role</h3>
    <div class="role-options">
      <label class="radio-label">
        <input type="radio" [(ngModel)]="selectedUser!.roleId" [value]="2" name="role" />
        User
      </label>
      <label class="radio-label">
        <input type="radio" [(ngModel)]="selectedUser!.roleId" [value]="1" name="role" />
        Admin
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-save" (click)="saveRole()">Save</button>
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal for deleting user -->
<div *ngIf="showDeleteModal" class="modal-overlay" (click)="cancelDelete()"></div>
<div *ngIf="showDeleteModal" class="modal">
  <div class="modal-content">
    <h3>Are you sure you want to delete this user {{ selectedUser?.name }}?</h3>
    <div class="modal-actions">
      <button class="btn-save" (click)="deleteUserConfirmed()">Yes</button>
      <button class="btn-cancel" (click)="cancelDelete()">No</button>
    </div>
  </div>
</div>

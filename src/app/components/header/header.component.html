<header class="header">
  <h1>Task Manager</h1>

  <div class="right-menu">
    <span class="welcome">Welcome, {{ userName }}</span>

    <div class="dropdown user-dropdown">
      <button type="button" class="menu-button icon-button" (click)="toggleUserMenu()">👤</button>
      <ul *ngIf="showUserMenu" class="menu-list">
        <li (click)="logout()">Logout</li>
      </ul>
    </div>
  </div>
</header>

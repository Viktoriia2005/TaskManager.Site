<div class="tasks">
  <h2>Manage Tasks</h2>

  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header (click)="sortTasks('title')">
          Title
          <span class="sort-arrow">{{ getSortArrow('title') }}</span>
        </th>
        <td mat-cell *matCellDef="let task">{{ task.title }}</td>
      </ng-container>

      <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef>
          Priority
          <button mat-icon-button [matMenuTriggerFor]="priorityMenu" aria-label="Priority filter">
            <mat-icon>more_vert</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let task">{{ task.priority }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>
          Status
          <button mat-icon-button [matMenuTriggerFor]="statusMenu" aria-label="Status filter">
            <mat-icon>more_vert</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let task">{{ task.status }}</td>
      </ng-container>

      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef mat-sort-header (click)="sortTasks('user')">
          User
          <span class="sort-arrow">{{ getSortArrow('user') }}</span>
        </th>
        <td mat-cell *matCellDef="let task">{{ task.user?.name }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div *ngIf="!filteredTasks.length" class="empty-state">No tasks found</div>
</div>

<mat-menu #priorityMenu="matMenu">
  <button mat-menu-item (click)="applyFilter('priority', null)">Show all</button>
  <button mat-menu-item *ngFor="let p of getFilterOptions('priority')" (click)="applyFilter('priority', p)">
    {{ p }}
  </button>
</mat-menu>

<mat-menu #statusMenu="matMenu">
  <button mat-menu-item (click)="applyFilter('status', null)">Show all</button>
  <button mat-menu-item *ngFor="let s of getFilterOptions('status')" (click)="applyFilter('status', s)">
    {{ s }}
  </button>
</mat-menu>

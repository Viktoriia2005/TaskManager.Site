<div class="header">
  <h1>Task Manager</h1>
  <span>Welcome, admin {{ adminName }}</span>
</div>

<div class="categories">
  <h2>Manage Categories</h2>
  <button class="btn-add" (click)="openAddModal()">+ Add</button>
  
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories">
        <td>{{ category.name }}</td>
        <td>
          <button class="btn-edit" (click)="editCategory(category)">Edit</button>
          <button class="btn-delete" (click)="deleteCategory(category.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal for creating/editing category -->
<div *ngIf="showCategoryModal" class="modal-overlay" (click)="cancel()"></div>
<div *ngIf="showCategoryModal" class="modal">
  <div class="modal-content">
    <h3>{{ isEditing ? 'Edit category' : 'Add new category' }}</h3>
    
    <div class="form-group">
      <label>Name</label>
      <input 
        type="text" 
        [(ngModel)]="selectedCategory!.name" 
        placeholder="Category name"
      />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea 
        [(ngModel)]="selectedCategory!.description" 
        placeholder="Category description"
        rows="3"
      ></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-save" (click)="saveCategory()">Save</button>
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>

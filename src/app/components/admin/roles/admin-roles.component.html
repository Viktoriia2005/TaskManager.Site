<!-- English: Material header and table layout; menu and dialogs use Angular Material -->
<mat-toolbar color="primary" class="header">
  <span class="title">Task Manager</span>
  <span class="spacer"></span>
  <span>Welcome, admin {{ adminName }}</span>
</mat-toolbar>

<div class="roles">
  <h2>Manage Roles</h2>

  <!-- English: Material table with dataSource and sort (if needed) -->
  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" matSort>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Role </th>
        <td mat-cell *matCellDef="let user">
          <div class="role-cell">
            <span>{{ getRoleName(user.roleId) }}</span>

            <!-- English: use mat-menu for per-row actions -->
            <button mat-icon-button [matMenuTriggerFor]="rowMenu" (click)="setActiveUser(user, $event)"
              aria-label="Open menu">
              <mat-icon>more_vert</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <!-- Header and Row definitions -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="openEditDialog(row)"></tr>
    </table>
  </div>

  <!-- Empty state -->
  <div *ngIf="!users.length" class="empty-state">No users yet</div>
</div>

<!-- English: shared mat-menu for row actions -->
<mat-menu #rowMenu="matMenu">
  <button mat-menu-item (click)="openEditDialog(activeUser)">
    <mat-icon>edit</mat-icon>
    <span>Edit</span>
  </button>
  <button mat-menu-item (click)="openDeleteDialog(activeUser)">
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
</mat-menu>

<!-- English: Edit role dialog template -->
<ng-template #editDialog let-data>
  <h2 mat-dialog-title>Edit {{ data.name }} role</h2>
  <mat-dialog-content>
    <mat-radio-group [(ngModel)]="editRoleId">
      <mat-radio-button *ngFor="let r of roles" [value]="r.id">{{ r.name }}</mat-radio-button>
    </mat-radio-group>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef?.close()">Cancel</button>
    <button mat-flat-button color="primary" (click)="saveRole()">Save</button>
  </mat-dialog-actions>
</ng-template>

<!-- English: Delete confirmation dialog template -->
<ng-template #deleteDialog let-data>
  <h2 mat-dialog-title>Confirm delete</h2>
  <mat-dialog-content>
    Are you sure you want to delete <strong>{{ data.name }}</strong>?
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef?.close()">No</button>
    <button mat-flat-button color="warn" (click)="deleteUserConfirmed()">Yes</button>
  </mat-dialog-actions>
</ng-template>

<mat-toolbar color="primary" class="header">
  <span class="title">Task Manager</span>
  <span class="spacer"></span>
  <span>Welcome, admin {{ adminName }}</span>
</mat-toolbar>

<div class="container">
  <div class="toolbar-row">
    <h2>Manage Categories</h2>
    <button mat-flat-button color="accent" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Add
    </button>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let category"> {{ category.name }} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let category">
          <button mat-icon-button color="primary" (click)="openEditDialog(category)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="openDeleteDialog(category)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="openEditDialog(row)"></tr>
    </table>

    <div *ngIf="!categories.length" class="empty-state">No categories yet</div>

  </div>
</div>

<div class="tasks-page">
  <app-header [userName]="currentUser?.name ?? 'User'" [tasks]="tasks" (logoutClick)="logout()"></app-header>

  <main class="dashboard">
    <h2>Task Dashboard</h2>

    <!-- Filters ... -->

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Deadline</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let task of filteredTasks">
            <td>{{ task.title }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.status }}</td>
            <td>{{ task.deadline | date:'dd MMM yyyy' }}</td>
            <td>{{ task.category?.name ?? 'Uncategorized' }}</td>
            <td class="menu-cell">
              <div class="menu">
                <button type="button" class="menu-trigger" (click)="toggleTaskMenu(task.id)">&#8942;</button>
                <ul *ngIf="openTaskMenuId === task.id" class="menu-list">
                  <li (click)="editTask(task)">Edit</li>
                  <li (click)="confirmDelete(task)">Delete</li>
                </ul>
              </div>
            </td>
          </tr>
          <tr *ngIf="!filteredTasks.length">
            <td colspan="6" class="empty-state">No tasks found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal for deleting task -->
<div *ngIf="showDeleteModal" class="modal-overlay" (click)="cancelDelete()"></div>
<div *ngIf="showDeleteModal" class="modal delete">
  <div class="modal-content">
    <h3>Are you sure you want to delete task "{{ selectedTask?.title }}"?</h3>
    <div class="modal-actions">
      <button class="btn-save" (click)="deleteTaskConfirmed()">Yes</button>
      <button class="btn-cancel" (click)="cancelDelete()">No</button>
    </div>
  </div>
</div>

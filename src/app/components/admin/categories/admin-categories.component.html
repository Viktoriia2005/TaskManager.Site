<div class="container">
  <div class="toolbar-row">
    <h2>{{ 'admin.categories.title' | t }}</h2>
    <button mat-flat-button color="accent" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      {{ 'category.add' | t }}
    </button>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'category.name' | t }}</th>
        <td mat-cell *matCellDef="let category">{{ translateCategory(category.name) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>{{ 'category.action' | t }}</th>
        <td mat-cell *matCellDef="let category">
          <button mat-icon-button color="primary" (click)="openEditDialog(category)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="openDeleteDialog(category)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="openEditDialog(row)"></tr>
    </table>

    <div *ngIf="!categories.length" class="empty-state">{{ 'admin.categories.empty' | t }}</div>
  </div>
</div>

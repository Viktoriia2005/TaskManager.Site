<div class="header">
  <h1>Task Manager</h1>
  <span>Welcome, admin {{ adminName }}</span>
</div>

<div class="tasks">
  <h2>Manage Tasks</h2>

  <table>
    <thead>
      <tr>
        <th (click)="sortTasks('title')">Title {{ getSortArrow('title') }}</th>
        <th>
          Priority
          <button class="menu-btn" (click)="toggleFilterMenu('priority', $event)">⋮</button>
        </th>
        <th>
          Status
          <button class="menu-btn" (click)="toggleFilterMenu('status', $event)">⋮</button>
        </th>
        <th (click)="sortTasks('user')">User {{ getSortArrow('user') }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let task of filteredTasks">
        <td>{{ task.title }}</td>
        <td>{{ task.priority }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.user?.name }}</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Filter dropdown menu -->
<ul *ngIf="activeFilter" class="dropdown-menu" [style.top.px]="filterMenuPosition.top"
  [style.left.px]="filterMenuPosition.left">
  <li *ngFor="let option of getFilterOptions(activeFilter)" (click)="applyFilter(activeFilter, option)">
    {{ option }}
  </li>
  <li (click)="applyFilter(activeFilter, null)">Show all</li>
</ul>

<div class="header">
  <h1>Task Manager</h1>
  <span>Welcome, admin {{ adminName }}</span>
</div>

<div class="categories">
  <h2>Manage Categories</h2>
  <button class="btn-add" (click)="openAddModal()">+ Add</button>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories" (dblclick)="editCategory(category)">
        <td>{{ category.name }}</td>
        <td>
          <button class="btn-edit" (click)="editCategory(category)">Edit</button>
          <button class="btn-delete" (click)="confirmDelete(category)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal for creating/editing category -->
<div *ngIf="showCategoryModal" class="modal-overlay" (click)="cancel()"></div>
<div *ngIf="showCategoryModal" class="modal">
  <div class="modal-content">
    <h3>{{ isEditing ? 'Edit category' : 'Add new category' }}</h3>

    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="selectedCategory!.name" placeholder="Category name" />
    </div>

    <div class="modal-actions">
      <button class="btn-save" (click)="saveCategory()">Save</button>
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal for deleting category -->
<div *ngIf="showDeleteModal" class="modal-overlay" (click)="cancelDelete()"></div>
<div *ngIf="showDeleteModal" class="modal delete">
  <div class="modal-content">
    <h3>Are you sure you want to delete this category {{ selectedCategory?.name }}?</h3>
    <div class="modal-actions">
      <button class="btn-save" (click)="deleteCategoryConfirmed()">Yes</button>
      <button class="btn-cancel" (click)="cancelDelete()">No</button>
    </div>
  </div>
</div>
